name: Sakuga Android APK build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'Sakuga Engine.csproj'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Android dependencies
        run: |
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          dotnet workload install android
      - name: Use verified Godot 4.7.2 Mono release
        run: |
          echo "EDITOR_URL=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" >> "$GITHUB_ENV"
          echo "TEMPLATE_URL=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" >> "$GITHUB_ENV"
      - name: Install Godot and templates
        shell: bash
        run: |
          curl -fL "$EDITOR_URL" -o godot.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin
          GODOT=$(find "$PWD/godot-bin" -type f -name 'Godot_v*' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -fL "$TEMPLATE_URL" -o templates.tpz
          mkdir -p unpacked
          unzip -q templates.tpz -d unpacked
          VERSION=$("$GODOT" --headless --version | head -n 1)
          echo "Godot version: $VERSION"
          TEMPLATE_VERSION=$(echo "$VERSION" | sed -E 's/\.mono(\.|$)/\1/')
          echo "Template directory version: $TEMPLATE_VERSION"
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          cp unpacked/templates/* "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/"
          EXACT_VERSION=$(echo "$VERSION" | cut -d. -f1-5)
          echo "Godot expects template version: $EXACT_VERSION"
          mkdir -p "$HOME/.local/share/godot/export_templates/$EXACT_VERSION"
          cp unpacked/templates/* "$HOME/.local/share/godot/export_templates/$EXACT_VERSION/"
          ls -lh "$HOME/.local/share/godot/export_templates/$EXACT_VERSION/"android*
          test -s "$HOME/.local/share/godot/export_templates/$EXACT_VERSION/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/$EXACT_VERSION/android_release.apk"
      - name: Configure debug signing
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Restore C# dependencies
        run: |
          dotnet restore "Sakuga Engine.csproj"
      - name: Build C# assemblies
        run: dotnet build "Sakuga Engine.csproj" --configuration Debug --no-restore
      - name: Import Godot resources
        run: |
          "$GODOT" --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT" --headless --path . --export-debug Android build/Sakuga-Android.apk
          test -s build/Sakuga-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sakuga-Android-APK
          path: build/Sakuga-Android.apk
          if-no-files-found: error
