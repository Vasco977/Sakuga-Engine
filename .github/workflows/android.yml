name: Android APK diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        run: |
          echo "GitHub Actions started successfully"
          test -f project.godot
          test -f "Sakuga Engine.csproj"
          test -f export_presets.cfg
          echo "Sakuga project files found"
